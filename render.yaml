# Render Blueprint: one web service (API + UI) and one PostgreSQL database.
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: paysim-sandbox
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /openapi.json
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paysim-db
          property: connectionString
      # Sandbox key of the "Demo Store" merchant; also baked into the UI at build time.
      - key: DEMO_API_KEY
        generateValue: true
      # Asked once when the Blueprint is created. Leave empty to disable the AI features.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: RATE_LIMIT
        value: 60/minute

databases:
  - name: paysim-db
    plan: free
    databaseName: paysim
    user: paysim
